[project]
name = "texet"
version = "0.1.0"
description = "Base API scaffold for Texet."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.32",
    "alembic>=1.13",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "filelock>=3.20.3",
    "sqlalchemy>=2.0",
    "itsdangerous>=2.2",
    "sqladmin>=0.16",
    "urllib3>=2.7.0",
    "uvicorn[standard]>=0.29",
    "fastapi-mail>=1.6.2",
    "apscheduler>=3.10,<4",
    "kani[openai]>=1.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "locust>=2.20",
    "boto3>=1.42.96",
    "starlette>=1.3.1",
    "pip>=26.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
