name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: texet
          POSTGRES_USER: texet
          POSTGRES_PASSWORD: texet_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U texet -d texet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://texet:texet_ci_password@127.0.0.1:5432/texet
      DATABASE_URL_TEST: postgresql+asyncpg://texet:texet_ci_password@127.0.0.1:5432/texet_test
      OPENAI_API_KEY: ci-test-key
      OPENAI_MODEL: gpt-4o-mini
      SMS_OUTBOUND_URL: ""
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ADMIN_SECRET_KEY: ci-admin-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov

  deploy_backend:
    name: Deploy Backend to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: eb-production-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ secrets.AWS_BACKEND_APPLICATION_NAME }}
          environment-name: ${{ secrets.AWS_PROD_BACKEND_ENVIRONMENT_NAME }}
          version-label: ${{ github.sha }}
          exclude-patterns: docker-compose.yml
          create-application-if-not-exists: false
          create-environment-if-not-exists: false

      - name: Verify deployment reached target version and healthy state
        env:
          APP_NAME: ${{ secrets.AWS_BACKEND_APPLICATION_NAME }}
          ENV_NAME: ${{ secrets.AWS_PROD_BACKEND_ENVIRONMENT_NAME }}
          TARGET_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Waiting for Elastic Beanstalk update to complete for environment: ${ENV_NAME}"
          aws elasticbeanstalk wait environment-updated \
            --region "${AWS_REGION}" \
            --environment-names "${ENV_NAME}"

          # Fetch live deployment state and enforce correctness.
          ENV_STATE="$(aws elasticbeanstalk describe-environments \
            --region "${AWS_REGION}" \
            --application-name "${APP_NAME}" \
            --environment-names "${ENV_NAME}" \
            --query 'Environments[0].[VersionLabel,Status,Health,HealthStatus]' \
            --output text)"

          ACTUAL_VERSION="$(echo "${ENV_STATE}" | awk '{print $1}')"
          STATUS="$(echo "${ENV_STATE}" | awk '{print $2}')"
          HEALTH="$(echo "${ENV_STATE}" | awk '{print $3}')"
          HEALTH_STATUS="$(echo "${ENV_STATE}" | awk '{print $4}')"

          echo "Elastic Beanstalk state:"
          echo "  version_label=${ACTUAL_VERSION}"
          echo "  status=${STATUS}"
          echo "  health=${HEALTH}"
          echo "  health_status=${HEALTH_STATUS}"

          if [ "${ACTUAL_VERSION}" != "${TARGET_VERSION}" ]; then
            echo "Deployment mismatch: expected version '${TARGET_VERSION}', got '${ACTUAL_VERSION}'"
            exit 1
          fi

          if [ "${STATUS}" != "Ready" ]; then
            echo "Environment status is not Ready: ${STATUS}"
            exit 1
          fi

          if [ "${HEALTH}" = "Red" ] || [ "${HEALTH_STATUS}" = "Degraded" ] || [ "${HEALTH_STATUS}" = "Severe" ]; then
            echo "Environment health check failed: health=${HEALTH}, health_status=${HEALTH_STATUS}"
            echo "Recent Elastic Beanstalk events:"
            aws elasticbeanstalk describe-events \
              --region "${AWS_REGION}" \
              --environment-name "${ENV_NAME}" \
              --max-items 20 \
              --output table || true
            exit 1
          fi
