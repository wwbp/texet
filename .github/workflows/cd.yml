name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy_backend:
    name: Deploy Backend to Elastic Beanstalk
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eb-production-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Show runner disk usage before deploy
        run: |
          set -euo pipefail
          df -h
          du -sh .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployment package
        run: |
          set -euo pipefail
          bash scripts/build-eb-deploy-package.sh deploy-eb.zip
          ls -lh deploy-eb.zip
          unzip -l deploy-eb.zip | sed -n '1,120p'

      - name: Deploy to Elastic Beanstalk
        id: eb_deploy
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ secrets.AWS_BACKEND_APPLICATION_NAME }}
          environment-name: ${{ secrets.AWS_PROD_BACKEND_ENVIRONMENT_NAME }}
          version-label: ${{ github.event.workflow_run.head_sha }}
          deployment-package-path: deploy-eb.zip
          wait-for-deployment: true
          wait-for-environment-recovery: true
          create-application-if-not-exists: false
          create-environment-if-not-exists: false

      - name: Assert EB deployment state
        env:
          DEPLOYED_VERSION: ${{ steps.eb_deploy.outputs['version-label'] }}
          DEPLOYED_STATUS: ${{ steps.eb_deploy.outputs['environment-status'] }}
          DEPLOYED_HEALTH: ${{ steps.eb_deploy.outputs['environment-health'] }}
          TARGET_VERSION: ${{ github.event.workflow_run.head_sha }}
          ENV_NAME: ${{ secrets.AWS_PROD_BACKEND_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          echo "Deployed version=${DEPLOYED_VERSION}, status=${DEPLOYED_STATUS}, health=${DEPLOYED_HEALTH}"
          test "${DEPLOYED_VERSION}" = "${TARGET_VERSION}"
          test "${DEPLOYED_STATUS}" = "Ready"

          # Health can briefly read Yellow right after a deploy while EB settles,
          # so poll until it reaches Green rather than asserting a single snapshot.
          if [ "${DEPLOYED_HEALTH}" = "Green" ]; then
            echo "Environment health is Green."
            exit 0
          fi
          echo "Health is ${DEPLOYED_HEALTH}; polling until Green (up to 5 min)..."
          for i in $(seq 1 30); do
            sleep 10
            health="$(aws elasticbeanstalk describe-environments \
              --environment-names "${ENV_NAME}" \
              --query 'Environments[0].Health' --output text)"
            echo "  [$((i*10))s] health=${health}"
            if [ "${health}" = "Green" ]; then
              echo "Environment health reached Green."
              exit 0
            fi
          done
          echo "Environment did not reach Green health within the timeout."
          exit 1

      - name: Smoke test deployed /health endpoint
        env:
          ENV_URL: ${{ steps.eb_deploy.outputs['environment-url'] }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_URL}" ] || [ "${ENV_URL}" = "None" ]; then
            echo "No environment URL returned by deploy action."
            exit 1
          fi

          if [[ "${ENV_URL}" == http://* || "${ENV_URL}" == https://* ]]; then
            URLS=("${ENV_URL%/}/health")
          else
            URLS=("https://${ENV_URL%/}/health" "http://${ENV_URL%/}/health")
          fi

          for url in "${URLS[@]}"; do
            echo "Probing ${url}"
            if curl --fail --show-error --silent --max-time 15 \
              --retry 8 --retry-delay 5 --retry-all-errors "${url}"; then
              exit 0
            fi
          done

          echo "Deployed app health endpoint did not return 2xx."
          exit 1
